name: Build Soteria Windows offline installer
# Runs the reusable package job for this build branch.

on:
  push:
    branches: [codex/windows-offline-build]
  workflow_dispatch:

permissions:
  actions: read
  contents: write # Reusable job reads private draft resource assets.

jobs:
  windows:
    uses: ./.github/workflows/windows-package.yml
    with:
      windows_standard: true
      resource_release: windows-build-resources-soteria-20261029
      resource_sha256: 81fa328c92182caf44147b8c756bf43a2542b50de983c8ab2f99cd83aa9e5529
