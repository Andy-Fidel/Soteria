name: Windows package checks (reusable)

on:
  workflow_call:
    inputs:
      windows_standard:
        type: boolean
        default: true
      windows_installer_run:
        type: string
        default: ""
      windows_speech_probe:
        type: boolean
        default: false
      resource_release:
        type: string
        default: ""
      resource_sha256:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      windows_installer_run:
        description: Retest an existing internal unsigned installer from this run ID
        type: string
      windows_speech_probe:
        description: Diagnose portable speech kernels only
        type: boolean
        default: false
      windows_standard:
        description: Build and test the internal Windows offline package only
        type: boolean
        default: false
      resource_release:
        description: Draft release containing windows-standard-sources.zip
        type: string
      resource_sha256:
        description: SHA256 of the verified source resource archive
        type: string

permissions:
  contents: read

jobs:
  windows-standard:
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.windows_standard }}
    runs-on: windows-2022
    permissions:
      contents: write # Read authenticated draft build-resource assets; never publish them.
    env:
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/scripts/windows-cpu.cmake
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      STATIC_VCRUNTIME: 'false'
      MANNA_FLAVOR: standard
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: windows-offline-cpu-v1
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      - name: Download verified build resources
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RESOURCE_RELEASE: ${{ inputs.resource_release }}
          RESOURCE_SHA256: ${{ inputs.resource_sha256 }}
        run: |
          if ($env:RESOURCE_RELEASE -notmatch '^windows-build-resources-[a-zA-Z0-9.-]+$') { throw 'Invalid build resource release' }
          if ($env:RESOURCE_SHA256 -notmatch '^[a-f0-9]{64}$') { throw 'Missing resource checksum' }
          New-Item -ItemType Directory -Force artifacts/source | Out-Null
          gh release download $env:RESOURCE_RELEASE --repo $env:GITHUB_REPOSITORY --pattern windows-standard-sources.zip --dir artifacts/source
          if ($LASTEXITCODE -ne 0) { throw 'Build resource download failed' }
          if ((Get-FileHash artifacts/source/windows-standard-sources.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:RESOURCE_SHA256) { throw 'Build resource checksum mismatch' }
          Expand-Archive artifacts/source/windows-standard-sources.zip -DestinationPath artifacts/windows-sources
      - run: bun run download:ndi-sdk --platform windows
      - run: python -m unittest discover -s scripts -p test_standard_package.py
      - run: python -m unittest discover -s scripts -p test_windows_verifier.py
      - run: bun run test:run
      - run: bun run lint
      - name: Build internal NSIS installer
        id: windows_installer
        run: bun run package:windows artifacts/windows-sources
      - name: Test native Windows code with local speech and inference
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --release --target x86_64-pc-windows-msvc --no-default-features --features onnx,whisper,package-check --locked
      - name: Generate local speech fixture
        shell: pwsh
        run: |
          powershell.exe -NoProfile -File scripts/generate-windows-speech.ps1 -OutputPath "$env:GITHUB_WORKSPACE/artifacts/speech.wav"
          if ($LASTEXITCODE -ne 0) { throw 'Speech fixture generation failed' }
          python -c "import wave,pathlib; w=wave.open('artifacts/speech.wav'); assert (w.getnchannels(),w.getsampwidth(),w.getframerate())==(1,2,16000); pathlib.Path('artifacts/speech.s16le').write_bytes(w.readframes(w.getnframes()))"
      - name: Install and test offline speech and scripture detection
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe | Select-Object -First 1
          if (!$installer) { throw 'Installer missing' }
          python scripts/verify-installed-windows.py $installer.FullName --speech-audio artifacts/speech.s16le --install-dir artifacts/installed/Manna --report artifacts/windows-installed-check.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed app checks failed' }
      - name: Save internal unsigned installer
        if: ${{ always() && steps.windows_installer.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: manna-windows-internal-unsigned
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            artifacts/windows-installed-check.json
          if-no-files-found: error
          retention-days: 14
      - name: Stage verified Windows release files
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe | Select-Object -First 1
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $source = git rev-parse HEAD
          python scripts/release-draft.py stage --platform windows --installer $installer.FullName --report artifacts/windows-installed-check.json --output artifacts/release-staged --version $version --source $source --run-url "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Release staging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: release-staged-windows
          path: artifacts/release-staged/
          if-no-files-found: error
          retention-days: 14

  windows-installed-check:
    if: ${{ inputs.windows_installer_run != '' }}
    runs-on: windows-2022
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts -p test_windows_verifier.py
      - name: Download existing internal installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_RUN: ${{ inputs.windows_installer_run }}
        run: |
          if ($env:INSTALLER_RUN -notmatch '^[0-9]+$') { throw 'Invalid installer run ID' }
          gh run download $env:INSTALLER_RUN --repo $env:GITHUB_REPOSITORY --name manna-windows-internal-unsigned --dir artifacts/installer
          if ($LASTEXITCODE -ne 0) { throw 'Installer download failed' }
      - name: Generate local speech fixture
        shell: pwsh
        run: |
          powershell.exe -NoProfile -File scripts/generate-windows-speech.ps1 -OutputPath "$env:GITHUB_WORKSPACE/artifacts/speech.wav"
          if ($LASTEXITCODE -ne 0) { throw 'Speech fixture generation failed' }
          python -c "import wave,pathlib; w=wave.open('artifacts/speech.wav'); assert (w.getnchannels(),w.getsampwidth(),w.getframerate())==(1,2,16000); pathlib.Path('artifacts/speech.s16le').write_bytes(w.readframes(w.getnframes()))"
      - name: Verify the exact installed EXE
        shell: pwsh
        run: |
          $installer = Get-ChildItem artifacts/installer -Recurse -Filter *.exe | Select-Object -First 1
          if (!$installer) { throw 'Installer missing' }
          python scripts/verify-installed-windows.py $installer.FullName --speech-audio artifacts/speech.s16le --install-dir artifacts/installed/Manna --report artifacts/windows-installed-check.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed app checks failed' }
      - name: Save installed verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installed-verification
          path: |
            artifacts/windows-installed-check.json
            artifacts/windows-native-check.json
          if-no-files-found: warn
          retention-days: 14

  windows-speech-probe:
    if: ${{ inputs.windows_speech_probe }}
    runs-on: windows-2022
    permissions:
      contents: write # Read authenticated draft build-resource assets; never publish them.
    env:
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/scripts/windows-cpu.cmake
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      STATIC_VCRUNTIME: 'false'
      MANNA_FLAVOR: standard
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: windows-offline-cpu-v1
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      - name: Download verified build resources
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RESOURCE_RELEASE: ${{ inputs.resource_release }}
          RESOURCE_SHA256: ${{ inputs.resource_sha256 }}
        run: |
          if ($env:RESOURCE_RELEASE -notmatch '^windows-build-resources-[a-zA-Z0-9.-]+$') { throw 'Invalid build resource release' }
          if ($env:RESOURCE_SHA256 -notmatch '^[a-f0-9]{64}$') { throw 'Missing resource checksum' }
          New-Item -ItemType Directory -Force artifacts/source | Out-Null
          gh release download $env:RESOURCE_RELEASE --repo $env:GITHUB_REPOSITORY --pattern windows-standard-sources.zip --dir artifacts/source
          if ($LASTEXITCODE -ne 0) { throw 'Build resource download failed' }
          if ((Get-FileHash artifacts/source/windows-standard-sources.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:RESOURCE_SHA256) { throw 'Build resource checksum mismatch' }
          Expand-Archive artifacts/source/windows-standard-sources.zip -DestinationPath artifacts/windows-sources
      - name: Generate local speech fixture
        shell: pwsh
        run: |
          powershell.exe -NoProfile -File scripts/generate-windows-speech.ps1 -OutputPath "$env:GITHUB_WORKSPACE/artifacts/speech.wav"
          if ($LASTEXITCODE -ne 0) { throw 'Speech fixture generation failed' }
          python -c "import wave,pathlib; w=wave.open('artifacts/speech.wav'); assert (w.getnchannels(),w.getsampwidth(),w.getframerate())==(1,2,16000); pathlib.Path('artifacts/speech.s16le').write_bytes(w.readframes(w.getnframes()))"
      - name: Measure scalar and SSE3 kernels
        run: python scripts/probe-windows-speech.py
      - name: Save speech diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-speech-diagnostics
          path: artifacts/speech-probe/
          if-no-files-found: warn
          retention-days: 14
