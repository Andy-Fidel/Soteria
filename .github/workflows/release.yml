name: Release (draft only)

on:
  workflow_dispatch:
    inputs:
      prepare_draft:
        description: Build both standard packages and prepare an unpublished draft
        type: boolean
        default: false
      windows_installer_run:
        description: Retest an existing internal unsigned installer from this run ID
        type: string
      windows_speech_probe:
        description: Diagnose portable speech kernels only
        type: boolean
        default: false
      windows_standard:
        description: Build and test the internal Windows offline package only
        type: boolean
        default: false
      resource_release:
        description: Draft release containing windows-standard-sources.zip
        type: string
      resource_sha256:
        description: SHA256 of the verified source resource archive
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts -p 'test_*.py'

  windows-checks:
    needs: validate
    if: ${{ !inputs.prepare_draft }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/windows-package.yml
    with:
      windows_standard: ${{ inputs.windows_standard }}
      windows_speech_probe: ${{ inputs.windows_speech_probe }}
      windows_installer_run: ${{ inputs.windows_installer_run }}
      resource_release: ${{ inputs.resource_release }}
      resource_sha256: ${{ inputs.resource_sha256 }}

  standard-draft:
    needs: validate
    if: ${{ inputs.prepare_draft }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/draft-release.yml
    with:
      resource_release: ${{ inputs.resource_release }}
      resource_sha256: ${{ inputs.resource_sha256 }}
