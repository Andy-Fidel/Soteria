name: Prepare standard draft release

on:
  workflow_call:
    inputs:
      resource_release:
        required: true
        type: string
      resource_sha256:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      resource_release:
        description: Draft resource release containing windows-standard-sources.zip
        required: true
        type: string
      resource_sha256:
        description: SHA256 of the resource archive
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: standard-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test release and packaging safeguards
        run: |
          python -m unittest discover -s scripts -p test_mac_microphone.py
          python -m unittest discover -s scripts -p test_release_draft.py
          python -m unittest discover -s scripts -p test_standard_package.py
      - name: Validate package version and resource inputs
        id: version
        env:
          RESOURCE_RELEASE: ${{ inputs.resource_release }}
          RESOURCE_SHA256: ${{ inputs.resource_sha256 }}
        run: |
          python - <<'PY'
          import json, os, re, runpy
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          if version != json.loads(Path('src-tauri/tauri.conf.json').read_text())['version']:
              raise ValueError('Frontend and desktop versions differ')
          runpy.run_path('scripts/release-draft.py')['identity'](version, os.environ['GITHUB_SHA'])
          if not re.fullmatch(r'windows-build-resources-[A-Za-z0-9.-]+', os.environ['RESOURCE_RELEASE']):
              raise ValueError('Invalid resource release')
          if not re.fullmatch(r'[a-f0-9]{64}', os.environ['RESOURCE_SHA256']):
              raise ValueError('Invalid resource checksum')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY

  windows:
    needs: validate
    permissions:
      contents: write # Authenticated download of the existing draft resources.
      actions: read
    uses: ./.github/workflows/windows-package.yml
    with:
      windows_standard: true
      resource_release: ${{ inputs.resource_release }}
      resource_sha256: ${{ inputs.resource_sha256 }}

  mac:
    permissions:
      contents: write # Authenticated draft resource download.
    needs: validate
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MANNA_FLAVOR: standard
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: standard-draft-mac
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      - name: Download verified common resources and pinned Mac speech model
        env:
          GH_TOKEN: ${{ github.token }}
          RESOURCE_RELEASE: ${{ inputs.resource_release }}
          RESOURCE_SHA256: ${{ inputs.resource_sha256 }}
        run: |
          mkdir -p artifacts/source
          gh release download "$RESOURCE_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern windows-standard-sources.zip --dir artifacts/source
          python3 - <<'PY'
          import hashlib, json, os, urllib.request, zipfile
          from pathlib import Path
          archive = Path('artifacts/source/windows-standard-sources.zip')
          if hashlib.sha256(archive.read_bytes()).hexdigest() != os.environ['RESOURCE_SHA256']:
              raise ValueError('Resource archive checksum mismatch')
          source = Path('artifacts/package-sources').resolve()
          with zipfile.ZipFile(archive) as zipped:
              for item in zipped.infolist():
                  if not (source / item.filename).resolve().is_relative_to(source):
                      raise ValueError('Unsafe archive path')
              zipped.extractall(source)
          lock = json.loads(Path('data/whisper-mac.lock.json').read_text())
          for relative, expected in lock['files'].items():
              target = source / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              url = f"https://huggingface.co/ggerganov/whisper.cpp/resolve/{lock['speech']['source_revision']}/{target.name}"
              urllib.request.urlretrieve(url, target)
              if hashlib.sha256(target.read_bytes()).hexdigest() != expected:
                  raise ValueError('Mac speech model checksum mismatch')
          PY
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:run
      - name: Build internal standard Mac DMG
        run: bun scripts/build-draft-mac.ts artifacts/package-sources
      - name: Test native Mac code
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --release --target aarch64-apple-darwin --no-default-features --features onnx,whisper,package-check --locked
      - name: Generate local speech fixture
        run: |
          say --file-format=WAVE --data-format=LEI16@16000 -o artifacts/speech.wav 'John chapter three verse sixteen. For God so loved the world.'
          python3 - <<'PY'
          import wave
          from pathlib import Path
          with wave.open('artifacts/speech.wav') as audio:
              assert (audio.getnchannels(), audio.getsampwidth(), audio.getframerate()) == (1, 2, 16000)
              Path('artifacts/speech.s16le').write_bytes(audio.readframes(audio.getnframes()))
          PY
      - name: Install and check the internal Mac DMG
        run: |
          dmg=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          test -n "$dmg"
          python3 scripts/verify-installed-mac.py "$dmg" --app-name 'Manna Internal' --identifier com.manna.internal --install-dir artifacts/installed --report artifacts/mac-installed-check.json --speech-audio artifacts/speech.s16le
          python3 scripts/release-draft.py stage --platform mac --installer "$dmg" --report artifacts/mac-installed-check.json --output artifacts/release-staged --version "$VERSION" --source "$GITHUB_SHA" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: release-staged-mac
          path: artifacts/release-staged/
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: [validate, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-staged-*
          merge-multiple: true
          path: artifacts/staged
      - name: Prepare checksums and release notes
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: python scripts/release-draft.py assemble --staged artifacts/staged --output artifacts/release --version "$VERSION" --source "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: standard-draft-release-bundle
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14
      - name: Create unpublished prerelease draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release-draft.py upload --bundle artifacts/release --repo "$GITHUB_REPOSITORY"
